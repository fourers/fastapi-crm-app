[project]
name = "fastapi-crm-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic",
    "click",
    "fastapi[standard]",
    "httpx",
    "psycopg",
    "python-dotenv",
    "rich",
    "sqlalchemy",
]

[dependency-groups]
dev = [
  "faker",
  "pytest",
  "ruff",
  "ty",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
