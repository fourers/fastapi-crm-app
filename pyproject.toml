[project]
name = "fastapi-crm-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "click>=8.4.2",
    "faker>=40.32.0",
    "fastapi[standard]>=0.139.2",
    "httpx>=0.28.1",
    "psycopg>=3.3.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "ruff>=0.15.22",
    "sqlalchemy>=2.0.51",
    "ty>=0.0.61",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
