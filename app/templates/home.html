<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>App - Home</title>

    <link rel="icon" type="image/svg" href="{{ url_for('static', path='favicon.svg') }}">

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="navbar-brand mb-0 h1">Home</span>
        <form method="post" action="{{ logout }}">
            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
        </form>
    </div>
</nav>

<main class="container py-4">
    <div class="card shadow-sm">
        <div class="card-header">
            <h5 class="mb-0">Clients</h5>
        </div>

        <div class="card-body">
            <!-- Loading state -->
            <div id="loading" class="text-center py-4">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2 text-muted">Loading clients...</p>
            </div>

            <!-- Error state -->
            <div id="error" class="alert alert-danger d-none" role="alert"></div>

            <!-- Data table -->
            <div id="table-container" class="table-responsive d-none">
                <table class="table table-hover align-middle mb-0">
                    <thead id="table-head"></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

</main>

<script>
    async function loadClients() {
        const loading = document.getElementById("loading");
        const error = document.getElementById("error");
        const tableContainer = document.getElementById("table-container");
        const tableHead = document.getElementById("table-head");
        const tableBody = document.getElementById("table-body");

        try {
            const response = await fetch("/api/client");

            if (!response.ok) {
                throw new Error(`Request failed with status ${response.status}`);
            }

            const clients = await response.json();

            if (!Array.isArray(clients)) {
                throw new Error("Expected /api/client to return a JSON array");
            }

            loading.classList.add("d-none");

            if (clients.length === 0) {
                tableContainer.classList.remove("d-none");

                tableBody.innerHTML = `
                    <tr>
                        <td colspan="100%" class="text-center text-muted py-4">
                            No clients found.
                        </td>
                    </tr>
                `;

                return;
            }

            // Use the keys from the first object as table columns.
            const columns = Object.keys(clients[0]);

            tableHead.innerHTML = `
                <tr>
                    ${columns.map(column => `
                        <th scope="col">${escapeHtml(column)}</th>
                    `).join("")}
                </tr>
            `;

            tableBody.innerHTML = clients.map(client => `
                <tr>
                    ${columns.map(column => `
                        <td>${formatValue(client[column])}</td>
                    `).join("")}
                </tr>
            `).join("");

            tableContainer.classList.remove("d-none");

        } catch (err) {
            loading.classList.add("d-none");

            error.textContent = `Unable to load clients: ${err.message}`;
            error.classList.remove("d-none");
        }
    }

    function formatValue(value) {
        if (value === null || value === undefined) {
            return '<span class="text-muted">—</span>';
        }

        if (typeof value === "object") {
            return escapeHtml(JSON.stringify(value));
        }

        return escapeHtml(String(value));
    }

    function escapeHtml(value) {
        return value
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    loadClients();
</script>

</body>
</html>
